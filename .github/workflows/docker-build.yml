name: Docker Build
# NOTE: This workflow validates the Docker build only (push: false).
# Pushing to Nexus is NOT automated here because Nexus runs self-hosted
# on localhost, which is unreachable from GitHub-hosted runners (no
# public IP/DNS). In a real deployment, Nexus would run on infrastructure
# reachable from the CI runner (e.g. a VPN-accessible server or a
# publicly routable instance), making automated push feasible.
# See docs/decisions/003-nexus-vs-ecr.md for the full trade-off analysis.

on:
  push:
    branches: [main]
    paths:
      - 'docker/app/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker/app/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/app
          push: false
          tags: modular-cicd-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
